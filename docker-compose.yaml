services:

  backend:
    container_name: backend
    platform: linux/amd64
    image: moviesregistry.azurecr.io/backend:${IMAGE_TAG:-v1}
    build:
      context: .
      dockerfile: dockerfiles/backend.dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/imdb_action_movies')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
  
  frontend:
    container_name: frontend
    platform: linux/amd64
    image: moviesregistry.azurecr.io/frontend:${IMAGE_TAG:-v1}
    build:
      context: .
      dockerfile: dockerfiles/frontend.dockerfile
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy